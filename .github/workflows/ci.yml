name: Foundation tests

on:
  push:
    branches:
      - main
      - "research/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - name: Python fixture tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --all-targets
      - name: Build binary
        run: cargo build --bin invariant
      - name: Standalone Zstandard baseline available
        run: zstd --version
      - name: Deterministic synthetic comparison
        run: python3 scripts/benchmark.py --binary target/debug/invariant --repetitions 3
